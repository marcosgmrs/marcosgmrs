<nav>
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-logo">MG</a>
  <div class="nav-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Início</a>
    <a routerLink="/projetos" routerLinkActive="active">Projetos</a>
    <a routerLink="/habilidades" routerLinkActive="active">Habilidades</a>
    <a routerLink="/sobre" routerLinkActive="active">Sobre</a>
    <a routerLink="/contato" routerLinkActive="active">Contato</a>
    <a
      [href]="site.webmail"
      target="_blank"
      rel="noopener noreferrer"
      class="nav-email"
      title="Entrar no e-mail {{ site.email }}"
      aria-label="Entrar no e-mail"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m3 7 9 6 9-6" />
      </svg>
    </a>
  </div>
</nav>

<div class="conteudo">
  <router-outlet />
</div>

<footer>
  <a [href]="site.url">{{ site.dominio }}</a>
  <span>·</span>
  <a [href]="'mailto:' + site.email">{{ site.email }}</a>
</footer>
